# Subtitle Translator Configuration

# Bazarr API settings
bazarr:
  url: "http://localhost:6767"
  api_key: "YOUR_BAZARR_API_KEY_HERE"

# OpenAI settings
# Note: OPENAI_API_KEY must be set as an environment variable
#
# Two-model approach for cost optimization:
# - gpt-5 handles complex context analysis with rule interpretation
# - gpt-5 performs cost-effective translation guided by context
#
# Service tiers control pricing and performance:
# - "auto": Standard pricing, fast responses (default for analysis)
# - "flex": 50% discount, slower responses (default for translation)
# - "default", "priority": Other available tiers
#
# Flex tier also provides automatic prompt caching (90% discount on cached tokens)
openai:
  analysis_model: "gpt-5"       # Pass 1: Context analysis (complex rule interpretation)
  translation_model: "gpt-5"    # Pass 2: Translation (cost-optimized with flex tier)
  batch_size: 50                # Number of subtitles per API call
  analysis_service_tier: "auto" # Standard tier for Pass 1 (interactive, needs fast responses)
  translation_service_tier: "flex" # Flex tier for Pass 2 (50% discount, can be slower)

# Language settings
# ISO 639-1 language codes (2-letter) for source and target languages
# English → Finnish uses specialized translation prompts with formality handling
# Other language pairs use generic translation prompts
languages:
  source: "en"      # Source subtitle language (en, es, fr, de, etc.)
  target: "fi"      # Target translation language (fi, es, de, ja, etc.)

# Path mappings - Map NAS paths to local mount points
# Useful when Bazarr runs on NAS but files are accessed via SMB mount
path_mappings:
  - from: "/volume1/movies"
    to: "/Volumes/NAS/movies"
  # Add more mappings as needed:
  # - from: "/volume2/films"
  #   to: "/Volumes/NAS2/films"

# Translation options
translation:
  skip_analysis: false      # Skip context analysis for faster translation
  save_context: true        # Save translation context as JSON
  dry_run: false           # List movies without translating
  validate_translation: true  # Check if translations are sufficiently different from original
  min_translation_difference: 0.8  # Minimum difference ratio (0.0-1.0) for validation
  log_token_usage: true     # Log API token usage to file for cost tracking
                            # Token usage log location: ~/.cache/subtrans/token_usage.jsonl
