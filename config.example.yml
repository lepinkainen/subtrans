# Subtitle Translator Configuration

# Bazarr API settings
bazarr:
  url: "http://localhost:6767"
  api_key: "YOUR_BAZARR_API_KEY_HERE"

# OpenAI settings
# API key can be set here or via OPENAI_API_KEY environment variable
# Get your API key from: https://platform.openai.com/api-keys
#
# Two-model approach for cost optimization:
# - gpt-5 handles complex context analysis with rule interpretation
# - gpt-5 performs cost-effective translation guided by context
#
# Service tiers control pricing and performance:
# - "auto": Standard pricing, fast responses (default for analysis)
# - "flex": 50% discount, slower responses (default for translation)
# - "default", "priority": Other available tiers
#
# Flex tier also provides automatic prompt caching (90% discount on cached tokens)
openai:
  api_key: "YOUR_OPENAI_API_KEY_HERE"  # Your OpenAI API key
  analysis_model: "gpt-5"       # Pass 1: Context analysis (complex rule interpretation)
  translation_model: "gpt-5"    # Pass 2: Translation (cost-optimized with flex tier)
  batch_size: 50                # Number of subtitles per API call
  analysis_service_tier: "auto" # Standard tier for Pass 1 (interactive, needs fast responses)
  translation_service_tier: "flex" # Flex tier for Pass 2 (50% discount, can be slower)

# Language settings
# ISO 639-1 language codes (2-letter) for source and target languages
# English → Finnish uses specialized translation prompts with formality handling
# Other language pairs use generic translation prompts
languages:
  source: "en"      # Source subtitle language (en, es, fr, de, etc.)
  target: "fi"      # Target translation language (fi, es, de, ja, etc.)

# Path mappings - Map NAS paths to local mount points
# Useful when Bazarr runs on NAS but files are accessed via SMB mount
path_mappings:
  - from: "/volume1/movies"
    to: "/Volumes/NAS/movies"
  # Add more mappings as needed:
  # - from: "/volume2/films"
  #   to: "/Volumes/NAS2/films"

# Translation options
translation:
  skip_analysis: false      # Skip context analysis for faster translation
  save_context: true        # Save translation context as JSON
  dry_run: false           # List movies without translating
  validate_translation: true  # Check if translations are sufficiently different from original
  min_translation_difference: 0.8  # Minimum difference ratio (0.0-1.0) for validation
  log_token_usage: true     # Log API token usage to file for cost tracking
                            # Token usage log location: ~/.cache/subtrans/token_usage.jsonl

# Subtitle validation - prevents wasted API costs from corrupted files
# Multi-layer validation catches corrupted cache, incomplete extractions, and truncated files
validation:
  min_subtitle_count: 50        # Minimum number of subtitle entries (typical movie: 1000+)
                                # Catches corrupted cache files with only a few entries
                                # Set lower for short films/trailers if needed

  min_subtitle_file_size: 2048  # Minimum file size in bytes (2KB)
                                # Catches truncated or empty subtitle files
                                # Usually no need to change this

  strict_validation: true       # Prompt user when validation fails vs auto-continue
                                # true: Ask user before proceeding with suspicious files (recommended)
                                #       Options: continue, re-extract, or skip
                                # false: Just warn and continue (not recommended - may waste API credits)

# Validation behavior:
# - Post-extraction validation: Checks files immediately after mkvextract
# - Cache validation: Verifies cached files before reuse (auto-repairs corrupted cache)
# - Pre-analysis validation: Final check before expensive GPT API calls
# - For short films/trailers where low counts are expected, you can:
#   * Set strict_validation: false to disable prompts
#   * Set min_subtitle_count lower (e.g., 10 for very short content)
#   * Choose "continue anyway" when prompted in strict mode

# Subtitle track selection - control how source subtitle tracks are selected
# Interactive mode shows all discovered tracks before processing, allowing you to:
# - Review track metadata (format, forced, SDH, entry count)
# - Manually override automatic track selection
# - Skip movies with incorrect or missing tracks
# - View all available tracks regardless of language
subtitle_selection:
  interactive_track_selection: true  # Show track table and prompt user for confirmation
                                     # true: Display all tracks with metadata and allow manual selection
                                     # false: Silently use automatic track selection

  auto_select_tracks: false          # Skip all prompts and use automatic selection
                                     # true: Never show prompts (fully automatic mode)
                                     # false: Show prompts when interactive_track_selection is true
                                     # Note: auto_select_tracks overrides interactive_track_selection
