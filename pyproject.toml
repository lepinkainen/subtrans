[project]
name = "subtrans"
version = "0.1.0"
description = "Subtitle Translator - Translates English subtitles to Finnish using OpenAI GPT models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.8.1",
    "prompt-toolkit>=3.0.47",
    "pysrt>=1.1.2",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
]

[project.scripts]
subtrans = "subtrans.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["subtrans*"]
exclude = ["tmp*", "tests*", "llm-shared*"]

[tool.setuptools.package-data]
subtrans = ["py.typed"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.mypy]
python_version = "3.14"
python_executable = ".venv/bin/python3"
exclude = [
    "^build/",
    "^dist/",
]

[[tool.mypy.overrides]]
module = [
    "pysrt",
]
ignore_missing_imports = true
