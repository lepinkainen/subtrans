[project]
name = "subtrans"
version = "0.1.0"
description = "Subtitle Translator - Translates English subtitles to Finnish using OpenAI GPT models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "openai>=2.8.1",
    "pysrt>=1.1.2",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
]

[project.scripts]
subtrans = "subtrans.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
