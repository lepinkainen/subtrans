  source: "https://platform.openai.com/pricing"

# Pricing structure:
# Each model can have different pricing tiers based on service_tier:
# - batch: Batch API pricing
# - flex: Flex tier (50% discount, slower)
# - standard: Standard tier (default)
# - priority: Priority tier (faster, more expensive)

